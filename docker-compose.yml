services:
  jupyter:

    image: murilofrancio770/ibr-notebook:latest

    container_name: ibr-notebook

    ports:
      - "8888:8888"

    cap_add:
      - NET_RAW
      - NET_ADMIN

    volumes:

      # Notebook
      - ./notebooks:/home/jovyan/ibr-notebook/notebooks
      # Scripts
      - ./scripts:/home/jovyan/ibr-notebook/scripts
      # Dataset original
      - ${DATASET_DIR}:/home/jovyan/dataset:ro

      # Resultados produzidos pelo usuário
      - ibr_resultados:/home/jovyan/ibr-notebook/resultados

    environment:

      DATASET_ZIP_PASSWORD: ${DATASET_ZIP_PASSWORD:-}

      DATASET_ZIP_PATH: /home/jovyan/dataset/cloud_telescope_raw_dataset_3.zip

    command: >
      start-notebook.py
      --ServerApp.root_dir=/home/jovyan/ibr-notebook
      --ServerApp.token=
      --ServerApp.password=


volumes:
  ibr_resultados: